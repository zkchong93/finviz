name: Run Jupyter Notebook (Tue–Sat ~11AM SGT)

on:
  schedule:
    # Target: ~11:00 AM Singapore/KL time. Nominal trigger is set ~4h30m
    # earlier (6:42 AM) because this workflow has been running consistently
    # ~4h13m-4h50m late (observed: 9AM nominal -> 1:13-1:50PM actual).
    # If the delay pattern shifts, adjust the hour below to compensate --
    # this does not fix the delay itself, only aims around it.
    - cron: '42 6 * * 2-6'
      timezone: 'Asia/Singapore'
  workflow_dispatch:       # Optional: allows manual trigger

permissions:
  contents: write

jobs:
  execute-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert
          pip install -r requirements.txt

      - name: Execute notebook
        run: |
          jupyter nbconvert --to notebook --execute --inplace finviz_backtest.ipynb

      - name: Commit updated notebook and CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add finviz_backtest.ipynb *.csv
          git commit -m "Update notebook and CSV output" || echo "No changes to commit"
          git push
